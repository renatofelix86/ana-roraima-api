# Regras de autenticação do Postgres.
#
# Substitui o pg_hba.conf padrão da imagem, que termina com
# "host all all all scram-sha-256" -- ou seja, QUALQUER papel a partir de
# QUALQUER endereço, incluindo o superusuário.
#
# Desenho: a restrição é por PAPEL e por TLS, nunca por IP de origem.
# Motivo: quando a porta é publicada pelo Docker, o Postgres enxerga o gateway
# da bridge (172.x.x.x) no lugar do IP real do cliente. Uma regra por faixa de
# IP não separaria "container da aplicação" de "internet", e um atacante cairia
# na regra permissiva.
#
# TYPE     DATABASE     USER         ADDRESS         METHOD

# Socket Unix, dentro do container: administração via `docker compose exec`.
# É o ÚNICO caminho até o superusuário de emergência.
local      all          all                          trust

# Conexões TCP: só estes dois papéis, e só com TLS.
#   - hidro_app:  dono dos objetos, usado pela api/worker e pela administração.
#                 NÃO é superusuário (criado por app.harden_db).
#   - powerbi_ro: somente SELECT nas views bi_*.
hostssl    all          hidro_app    all             scram-sha-256
hostssl    all          powerbi_ro   all             scram-sha-256

# Qualquer outra combinação é recusada por omissão -- inclusive o superusuário
# `hidrologia`, que inicializou o cluster e o PostgreSQL não deixa rebaixar.
